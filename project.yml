name: WellPath
options:
  bundleIdPrefix: com.keegandolan
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0

targets:
  WellPath:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - WellPath
    dependencies:
      - package: Supabase
        product: Supabase
    info:
      path: WellPath/Info.plist
      properties:
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleShortVersionString: "1.01"
        CFBundleVersion: "2"
        LSRequiresIPhoneOS: true
        UIUserInterfaceStyle: Dark
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities:
          - armv7
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - remote-notification
          - fetch
        NSHealthShareUsageDescription: "WellPath needs access to your health data to track sleep, exercise, and nutrition metrics."
        NSHealthUpdateUsageDescription: "WellPath needs to update your health data to save your tracked metrics."
    settings:
      base:
        PRODUCT_NAME: WellPath
        PRODUCT_BUNDLE_IDENTIFIER: com.keegandolan.WellPath
        DEVELOPMENT_TEAM: WBD2UD25RR
        INFOPLIST_FILE: WellPath/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.9"
        ENABLE_PREVIEWS: true
        TARGETED_DEVICE_FAMILY: "1"
        # Build performance optimizations
        SWIFT_STRICT_CONCURRENCY: minimal
        OTHER_SWIFT_FLAGS: "-Xfrontend -warn-long-function-bodies=200 -Xfrontend -warn-long-expression-type-checking=200"
      configs:
        Debug:
          SWIFT_COMPILATION_MODE: singlefile
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          DEBUG_INFORMATION_FORMAT: dwarf
          ONLY_ACTIVE_ARCH: true
        Release:
          SWIFT_COMPILATION_MODE: wholemodule
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          ENABLE_PREVIEWS: false
          DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"
    entitlements:
      path: WellPath/WellPath.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        aps-environment: development
        com.apple.developer.associated-domains:
          - applinks:wellpath.app
          - webcredentials:wellpath.app

schemes:
  WellPath:
    build:
      targets:
        WellPath: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
